pipeline:
  target_fps: 30
  log_level: INFO

capture:
  source: webcam
  device_id: 1
  resolution: [1280, 720]

pose:
  backend: mediapipe            # mediapipe | rtmpose
  confidence_threshold: 0.3
  model_complexity: 2           # 0=lite, 1=full, 2=heavy (mediapipe only)
  # model_path: src/biomechanics/pose/models/rtmpose-m-256x192.onnx  # uncomment for rtmpose

triangulation:                    # multi-camera mode is NOWVA_MULTI_CAMERA=true
  max_sync_delta_ms: 20.0

camera_calibration:               # person-based camera calibration (multi-camera only)
  # camera_keys: {0: macbook, 1: usb_left, 2: usb_right}   # device id -> ~/.nowva/intrinsics_<key>.json
  calibration_buffer_frames: 450  # ring buffer of 2D views seen by >= 2 cameras (~15 s)
  use_bar_scale: false            # barbell as metric ruler while a capture window is open
  bar_detection_stride: 3         # bar detection on every Nth captured frame
  min_calibration_frames: 240     # no calibration file: capture this many frames...
  min_squat_excursions: 2         # ...and this many slow squats before solving
  capture_timeout_s: 90.0         # then fall back to the T-pose calibration
  drift_ratio: 1.5                # refine between sets when reprojection RMS > ratio x stored
  drift_check_frames: 150

faults:
  depth:                          # hip height above the knee, in femur lengths (0 = parallel)
    default_target_ratio: 0.0     # parallel: never ask a calibrated athlete deeper than this
    uncalibrated_target_ratio: 0.2  # lenient start until calibration measures the athlete
    max_target_ratio: 0.5         # never accept a target shallower than a half squat
    tolerance_ratio: 0.08         # a rep counts within this of the target
    moderate_deficit_ratio: 0.25
    severe_deficit_ratio: 0.5
  bilateral_asymmetry:            # other profiles' knee-angle symmetry; squat uses bar tilt
    mild: 8.0
    moderate: 13.0
    severe: 18.0
  forward_lean:                   # other profiles only; squat judges hip_shoot instead
    mild: 145.0
    moderate: 135.0
    severe: 125.0
  knee_valgus:                    # femur deviation (deg) from the knees-over-toes plane
    mild: 8.0
    moderate: 13.0
    severe: 18.0
  heel_rise:                      # ankle rise above its planted floor (multi-camera only)
    mild_cm: 1.5
    moderate_cm: 3.0
    severe_cm: 5.0
    cooldown_s: 2.0
    min_rise_duration_s: 0.23
  hip_shoot:                      # deg of extra trunk pitch by 1/3 of the way up
    mild: 8.0
    moderate: 12.0
    severe: 18.0
  hip_shift:                      # sideways pelvis travel / ankle separation (approximate on one camera)
    mild: 0.10
    moderate: 0.15
    severe: 0.22
  balance:                        # load offset from midfoot / ankle-to-toe length
    forward_mild: 0.20
    forward_moderate: 0.30
    forward_severe: 0.40
    backward_mild: 0.30
    backward_moderate: 0.40
    backward_severe: 0.50
  depth_drift:                    # shallower than the session's 3 deepest reps' median, femur lengths
    mild: 0.15
    moderate: 0.25
    severe: 0.35
  lockout:                        # top-of-rep hip deficit / leg length
    mild: 0.05
    moderate: 0.08
    severe: 0.12
  descent_control:                # descents shorter than these are dive-bombed (s)
    mild_seconds: 0.6
    moderate_seconds: 0.45
    severe_seconds: 0.3
  velocity_loss:                  # concentric velocity loss vs the set's fastest rep (%)
    mild_pct: 20.0
    moderate_pct: 30.0
    severe_pct: 40.0
  foot_placement:                 # setup stagger / ankle-to-toe length, toe-out difference (deg)
    stagger_mild: 0.15
    stagger_moderate: 0.25
    stagger_severe: 0.35
    flare_mild_deg: 10.0
    flare_moderate_deg: 15.0
    flare_severe_deg: 22.0

coaching:
  min_cue_gap_seconds: 1.0
  set_timeout_seconds: 30.0     # Pause > this = new set
  cache_cues_before_set: true

ipc:
  frame_send_interval: 10       # Send frame data every N frames
  fault_cooldown_seconds: 3.0

kalman:                           # fixed-lag Kalman smoother — the only temporal filter before IK
  lag_frames: 2                   # analysis lags 2 frames (~66 ms at 30 fps); display is undelayed
  process_noise: 10.0
  measurement_std_floor_m: 0.003
  single_camera_measurement_std_floor_m: 0.01
  measurement_std_ceiling_m: 0.08
  gate_sigma: 4.0
  gate_min_radius_m: 0.08
  max_prediction_s: 0.17          # analysis carries an unmeasured keypoint this long (5 frames at 30 fps)
  min_output_confidence: 0.15

foot_contact:
  enabled: true                   # world-frame planted-foot model (multi-camera only)

standing_gate:
  min_confidence: 0.25
  max_knee_flexion_deg: 25.0
  max_trunk_flexion_deg: 25.0
  min_torso_length_m: 0.25
  max_torso_length_m: 0.80
  required_consecutive_frames: 5

bilstm:
  enabled: true
  model_path: models/bilstm_rep_counter.pt
  device: cpu
  num_classes: 5
  min_depth_class: 3              # 0=standing, 1=quarter, 2=half, 3=parallel, 4=deep
  min_rep_frames: 12
  ema_alpha: 0.2

hip_counter:
  entry_vel_threshold: 3.0        # cm/s — triggers STANDING→DESCENDING
  bottom_vel_threshold: 5.0       # cm/s — abs(vel) below this = at bottom
  ascending_vel_threshold: 3.0    # cm/s — vel < -this = BOTTOM→ASCENDING
  min_depth_cm: 10.0              # minimum displacement for valid rep (like prominence)
  standing_return_cm: 3.0         # must return within this of baseline to complete rep
  min_descending_s: 0.1           # minimum time in each state (3, 2, 3 frames at 30 fps)
  min_bottom_s: 0.067
  min_ascending_s: 0.1
  min_rep_duration_s: 0.5         # 15 frames at 30 fps
