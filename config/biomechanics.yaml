pipeline:
  target_fps: 30
  log_level: INFO

capture:
  source: webcam
  device_id: 1
  resolution: [1280, 720]
  # Single camera's physical mount (not an estimate). NOWVA_CAMERA_PITCH_DEG overrides the pitch.
  mount_source: none              # rack (fixed bracket) | inclinometer (measured at setup) | none
  mount_pitch_deg: null           # + = lens tilted up
  mount_height_m: null            # lens height above the floor

pose:
  backend: mediapipe            # mediapipe | rtmpose
  confidence_threshold: 0.3
  model_complexity: 2           # 0=lite, 1=full, 2=heavy (mediapipe only)
  # model_path: src/biomechanics/pose/models/rtmpose-m-256x192.onnx  # uncomment for rtmpose

triangulation:                    # multi-camera mode is NOWVA_MULTI_CAMERA=true
  max_sync_delta_ms: 20.0

camera_calibration:               # person-based camera calibration (multi-camera only)
  # camera_keys: {0: macbook, 1: usb_left, 2: usb_right}   # device id -> ~/.nowva/intrinsics_<key>.json
  calibration_buffer_frames: 450  # ring buffer of 2D views seen by >= 2 cameras (~15 s)
  use_bar_scale: false            # barbell as metric ruler while a capture window is open
  bar_detection_stride: 3         # bar detection on every Nth captured frame
  min_calibration_frames: 240     # no calibration file: capture this many frames...
  min_squat_excursions: 2         # ...and this many slow squats before solving
  capture_timeout_s: 90.0         # then fall back to the T-pose calibration
  drift_ratio: 1.5                # refine between sets when reprojection RMS > ratio x stored
  drift_check_frames: 150

faults:
  depth:                          # hip height above the knee, in femur lengths (0 = parallel)
    default_target_ratio: 0.0     # parallel: never ask a calibrated athlete deeper than this
    uncalibrated_target_ratio: 0.2  # lenient start until calibration measures the athlete
    max_target_ratio: 0.5         # never accept a target shallower than a half squat
    tolerance_ratio: 0.08         # a rep counts within this of the target
    moderate_deficit_ratio: 0.25
    severe_deficit_ratio: 0.5
  bilateral_asymmetry:            # other profiles' knee-angle symmetry; squat uses bar tilt
    mild: 8.0
    moderate: 13.0
    severe: 18.0
  forward_lean:                   # other profiles only; squat judges hip_shoot instead
    mild: 145.0
    moderate: 135.0
    severe: 125.0
  knee_valgus:                    # femur deviation (deg) from the knees-over-toes plane
    mild: 8.0
    moderate: 13.0
    severe: 18.0
  heel_rise:                      # ankle rise above its planted floor (multi-camera only)
    mild_cm: 1.5
    moderate_cm: 3.0
    severe_cm: 5.0
    cooldown_s: 2.0
    min_rise_duration_s: 0.23
  hip_shoot:                      # deg of extra trunk pitch by 1/3 of the way up
    mild: 8.0
    moderate: 12.0
    severe: 18.0
  hip_shift:                      # sideways pelvis travel / ankle separation (approximate on one camera)
    mild: 0.10
    moderate: 0.15
    severe: 0.22
  balance:                        # load offset from midfoot / ankle-to-toe length
    forward_mild: 0.20
    forward_moderate: 0.30
    forward_severe: 0.40
    backward_mild: 0.30
    backward_moderate: 0.40
    backward_severe: 0.50
  depth_drift:                    # shallower than the session's 3 deepest reps' median, femur lengths
    mild: 0.15
    moderate: 0.25
    severe: 0.35
  lockout:                        # top-of-rep hip deficit / leg length
    mild: 0.05
    moderate: 0.08
    severe: 0.12
  descent_control:                # descents shorter than these are dive-bombed (s)
    mild_seconds: 0.6
    moderate_seconds: 0.45
    severe_seconds: 0.3
  velocity_loss:                  # concentric velocity loss vs the set's fastest rep (%)
    mild_pct: 20.0
    moderate_pct: 30.0
    severe_pct: 40.0
  foot_placement:                 # setup stagger / ankle-to-toe length, toe-out difference (deg)
    stagger_mild: 0.15
    stagger_moderate: 0.25
    stagger_severe: 0.35
    flare_mild_deg: 10.0
    flare_moderate_deg: 15.0
    flare_severe_deg: 22.0
  press:                          # standing barbell overhead press (docs/exercises/ohp.md)
    counter:                      # signal: bar (wrists) above the shoulders, cm (§3.4)
      entry_vel_threshold: 12.0
      bottom_vel_threshold: 6.0
      ascending_vel_threshold: 10.0
      min_depth_cm: 20.0
      standing_return_cm: 6.0
      min_descending_s: 0.25
      min_bottom_s: 0.08
      min_ascending_s: 0.25
      min_rep_duration_s: 0.8
      velocity_window_s: 0.40     # least-squares velocity over 0.4 s (5 samples at 12 fps, 12 at 30)
    arm_to_torso_ratio: 1.15      # arm length estimate from the torso (Drillis & Contini)
    rack:                         # front-rack readiness predicate (§3.2), ratios of the arm estimate
      min_arm_confidence: 0.3
      bar_height_min_ratio: -0.25
      bar_height_max_ratio: 0.30
      min_forearm_rise_m: 0.10
      max_hand_level_ratio: 0.08
      min_grip_to_shoulder_width_ratio: 0.9
      reference_frames: 5
      reference_window_s: 2.0
      rack_floor_torso_ratio: 0.35
      min_signal_confidence: 0.1
      re_rack_reset_s: 2.0
    acceptance:                   # when a press counts (§3.5)
      setup_min_samples: 3
      setup_window_s: 0.5
      top_height_min_ratio: 0.80
      clipped_wrists_min_ratio: 0.60
      missed_min_travel_cm: 20.0
    camera:                       # single-camera bands and delta tripwire (§4.1)
      tripwire_deg: 3.0
      level_band_deg: 3.0
      tilted_band_deg: 10.0
    facing_min_width_ratio: 0.94  # cos 20 deg
    lockout_side_min_difference_deg: 8.0
    layback: {mild: 12.0, moderate: 18.0, severe: 25.0}            # deg
    bar_forward: {mild: 0.10, moderate: 0.17, severe: 0.25}        # arm lengths ahead of midfoot
    lockout: {mild: 15.0, moderate: 25.0, severe: 35.0}            # deg short of straight
    leg_drive: {mild: 0.035, moderate: 0.06, severe: 0.10}         # hip drop / leg length
    uneven: {mild: 4.0, moderate: 6.0, severe: 9.0}                # bar tilt, deg
    grip: {mild: 10.0, moderate: 15.0, severe: 22.0}               # forearm tilt, deg
    velocity_loss_pct: {mild: 20.0, moderate: 30.0, severe: 40.0}
    hedged_recap_faults: []       # recorded-only faults the recap may hedge (from validation)
    tilted_band_validated: false
    uneven_promoted: false
  rdl:                            # barbell Romanian deadlift from the rack (docs/exercises/rdl.md)
    counter: {entry_vel_threshold: 4.0, bottom_vel_threshold: 5.0, ascending_vel_threshold: 4.0,
              min_depth_cm: 8.0, standing_return_cm: 4.0, min_descending_s: 0.25,
              min_bottom_s: 0.08, min_ascending_s: 0.25, min_rep_duration_s: 0.8}
    rom: {count_floor_travel: 0.45, partial_min_travel: 0.25, fallback_floor_deg: 50.0,
          partial_min_duration_s: 1.0, partial_cue_streak: 2, max_partial_cues_per_set: 2,
          highlight_range_tolerance_deg: 8.0, reference_cap_deg: 95.0}
    camera: {tripwire_deg: 8.0, posture_offset_deg: 4.0, correct_by_mount_angle: false,
             delta_tripwire_deg: 2.5, delta_min_frames: 36, reference_sets: 3,
             certified_max_pitch_deg: 2.0, lens_min_height_m: 0.8, lens_max_height_m: 1.1,
             lens_max_below_hip_m: 0.10, ankle_height_m: 0.075}
    readiness_wrist_below_hip_m: 0.05
    rig_min_cue_severity: moderate  # until measured gravity and the rig validation
    hip_sink: {mild: 0.12, moderate: 0.15, severe: 0.19}       # start tier: mild iff mount certified
    bar_drift: {mild: 0.25, moderate: 0.40, severe: 0.60}      # ankle->toe lengths ahead of midfoot
    lockout: {forward_mild: 10.0, forward_moderate: 15.0, forward_severe: 22.0,
              back_mild: 8.0, back_moderate: 12.0, back_severe: 18.0}
    bar_tilt: {mild: 4.0, moderate: 7.0, severe: 10.0}         # deg, bottom minus start
    range_drift: {mild: 8.0, moderate: 15.0, severe: 25.0}     # deg short of own reference
    partial: {moderate: 0.07, severe: 0.14}                    # travel short of the floor
    tempo: {mild_seconds: 0.67, moderate_seconds: 0.50, severe_seconds: 0.33}   # 5-95% descent
    hedged_recap_faults: []

coaching:
  min_cue_gap_seconds: 1.0
  set_timeout_seconds: 30.0     # Pause > this = new set
  cache_cues_before_set: true

ipc:
  frame_send_interval: 10       # Send frame data every N frames
  fault_cooldown_seconds: 3.0

kalman:                           # fixed-lag Kalman smoother — the only temporal filter before IK
  lag_frames: 2                   # analysis lags 2 frames (~66 ms at 30 fps); display is undelayed
  process_noise: 10.0
  measurement_std_floor_m: 0.003
  single_camera_measurement_std_floor_m: 0.01
  measurement_std_ceiling_m: 0.08
  gate_sigma: 4.0
  gate_min_radius_m: 0.08
  max_prediction_s: 0.17          # analysis carries an unmeasured keypoint this long (5 frames at 30 fps)
  min_output_confidence: 0.15

foot_contact:
  enabled: true                   # world-frame planted-foot model (multi-camera only)

standing_gate:
  min_confidence: 0.25
  max_knee_flexion_deg: 25.0
  max_trunk_flexion_deg: 25.0
  min_torso_length_m: 0.25
  max_torso_length_m: 0.80
  required_consecutive_frames: 5

bilstm:
  enabled: true
  model_path: models/bilstm_rep_counter.pt
  device: cpu
  num_classes: 5
  min_depth_class: 3              # 0=standing, 1=quarter, 2=half, 3=parallel, 4=deep
  min_rep_frames: 12
  ema_alpha: 0.2

hip_counter:
  entry_vel_threshold: 3.0        # cm/s — triggers STANDING→DESCENDING
  bottom_vel_threshold: 5.0       # cm/s — abs(vel) below this = at bottom
  ascending_vel_threshold: 3.0    # cm/s — vel < -this = BOTTOM→ASCENDING
  min_depth_cm: 10.0              # minimum displacement for valid rep (like prominence)
  standing_return_cm: 3.0         # must return within this of baseline to complete rep
  min_descending_s: 0.1           # minimum time in each state (3, 2, 3 frames at 30 fps)
  min_bottom_s: 0.067
  min_ascending_s: 0.1
  min_rep_duration_s: 0.5         # 15 frames at 30 fps
