# V2 teacher B: Whisper-Large-v3 encoder frozen, heads trained on a learnable weighted layer sum.
# Beat fully fine-tuned WavLM-Large in SAIL's controlled ablation and is the best cross-corpus encoder.
# Position embeddings are sliced to the real frame count (no 30 s padding) in models/encoder.py.
name: teacher-whisper-large-v3-frozen
seed: 0
model:
  encoder:
    name: whisper
    pretrained: openai/whisper-large-v3
    freeze_all: true
    gradient_checkpointing: false
  pooling:
    layer_select: weighted
    pooling: mean_std
  categorical: true
  avd: true
  head_hidden: 512
  dropout: 0.2
data:
  train:
    - {manifest: data/affect/manifests/msp_podcast.jsonl, weight: 1.0}
  dev:
    - {manifest: data/affect/manifests/msp_podcast.jsonl, weight: 1.0}
  test:
    - {manifest: data/affect/manifests/msp_podcast.jsonl, weight: 1.0}
  sample_rate: 16000
  crop_seconds: 12.0
  min_seconds: 1.0
  keep_other_class: true
  augment:
    enabled: true
    apm_prob: 0.5
    speed_prob: 0.0
  num_workers: 8
loss:
  w_cat: 1.5
  w_avd: 0.4
  class_weighting: inverse_freq
  mixup_prob: 0.0             # encoder is frozen; mixup at the head only would need pooled-level mixing
optim:
  encoder_lr: 0.0
  head_lr: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 300
  epochs_stage1: 15
  epochs_stage2: 5
  batch_size: 16
  grad_accum: 2
  bf16: true
  early_stop_patience: 4
  select_metric: dev/avg_ccc
output_dir: experiments
notes: "V2 teacher B. Frozen encoder: cache per-layer mean⊕std once (~5 GPU-h) to make head training minutes."
